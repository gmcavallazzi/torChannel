# Phase 5 (decisive fair test): staggered-herringbone DUCT at high Schmidt number.
# Combines the chaotic-advection geometry (Phase-4 herringbone floor, via volume
# penalization) with the seam-free duct (bc_y: wall, spectral DCT y-walls) and the
# high-Sc TVD scalar. The chevron grooves drive alternating counter-rotating helical
# rolls (exponential stretch/fold) that the plain duct lacked -- the regime the
# proposal's fractal claim actually needs. If L_mix(N) finally drops here, the claim
# holds in the chaotic regime; if it stays flat, that is the strong general negative.
grid:   {nx: 48, ny: 48, nz: 48}
domain: {Lx: 3.1416, Ly: 1.0, Lz: 1.0, bc_y: wall}   # square duct cross-section

flow:
  Re: 50.0
  Re_tau: 10.0
  U_bulk: 1.0
  gamma: 0.4

boundary_conditions:
  top_wall: {type: "dirichlet"}

initialization:
  type: "parabolic"
  perturbation_intensity: 0.0

solver: {type: "fft"}

time:
  dt: 0.003            # AB2-stable: dt < dy^2/(4 nu) ~= 0.0054 at ny=48, Ly=1
  n_steps: 25000
  t_max: 100000.0
  CFL_target: 0.25
  dt_update_interval: 0
  dt_max: 0.02
  dt_min: 0.0001
  scheme: "IMEX"

compute: {device: "cuda"}

output:
  results_folder: results/herringbone_duct
  n_out: 100000
  n_save: 100000

statistics: {enabled: false, n_stats: 0}

immersed:
  enabled: true
  kind: "herringbone"
  h0: 0.25
  A: 0.18            # ridges span z in [0.07, 0.43] -> fills most of the Lz=1 gap
  n_waves_x: 3       # 3 chevron cycles along x (apex side staggers each cycle)
  n_waves_y: 1
  apex_frac: 0.35    # off-centre apex -> asymmetric counter-rotating rolls (SHM)
  stagger: true
  eta: 1.0e-4

scalar:
  enabled: true
  Sc: 16.0
  wall_bc: "neumann"
  scheme: "tvd"        # van Leer limiter: monotone at the high cell-Pe of Sc=16
  init_type: "koch"
  N: 0                 # swept 0/1/2 by the driver
  r: 3.0
  eps_cells: 1.0
  theta: 0.5
