# Small LAMINAR channel + passive scalar — integration smoke / mixing-decay test.
grid:   {nx: 16, ny: 16, nz: 24}
domain: {Lx: 3.1416, Ly: 3.1416, Lz: 2.0}

flow:
  Re: 100.0        # bulk Reynolds (laminar)
  Re_tau: 10.0     # nominal (used only by statistics scaling)
  U_bulk: 1.0
  gamma: 1.5

initialization:
  type: "parabolic"            # laminar Poiseuille base flow
  perturbation_intensity: 0.0

solver: {type: "fft"}

time:
  dt: 0.002
  n_steps: 20
  t_max: 1000.0
  CFL_target: 0.25
  dt_update_interval: 0        # fixed dt for a clean smoke test
  dt_max: 0.01
  dt_min: 0.0001
  scheme: "IMEX"

compute: {device: "cpu"}

output:
  results_folder: /tmp/torchannel_scalar_test
  n_out: 5
  n_save: 100000               # don't checkpoint during the short test

statistics: {enabled: false, n_stats: 0}

# ---- passive scalar -------------------------------------------------------
scalar:
  enabled: true
  Sc: 1.0
  wall_bc: "neumann"           # no-flux walls -> mixing/decay study
  init_type: "interface_y"     # two co-flowing streams split on the spanwise centreline
  interface_pos: 0.5
  eps_cells: 1.0
  theta: 0.5                   # Crank-Nicolson for implicit z-diffusion
