# ==============================================================================
# DNS CHANNEL FLOW CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# GRID PARAMETERS
# ------------------------------------------------------------------------------
grid:
  nx: 768    # Number of grid points in streamwise (x) direction
  ny: 768    # Number of grid points in spanwise (y) direction
  nz: 180    # Number of grid points in wall-normal (z) direction

# ------------------------------------------------------------------------------
# DOMAIN SIZE
# ------------------------------------------------------------------------------
domain:
  Lx: 15.707  # Streamwise domain length (5π for this case)
  Ly: 6.282   # Spanwise domain length (2π for this case)
  Lz: 2.0     # Wall-normal domain height (channel half-height = 1.0)

# ------------------------------------------------------------------------------
# FLOW PARAMETERS
# ------------------------------------------------------------------------------
flow:
  Re: 10000.0      # NOTE: the solver reads this as nu = 1/Re directly
                   # (nu = 1e-4). It is NOT U_bulk*Lz/nu.
  Re_tau: 550.0    # Target friction Reynolds number (Re_τ = u_τ * δ / ν, where δ = Lz/2)
  U_bulk: 1.0      # Target bulk velocity (enforced via forcing)
  gamma: 2.6       # Grid stretching parameter for wall-normal direction (higher = more clustering near walls)

# ------------------------------------------------------------------------------
# INITIALIZATION
# ------------------------------------------------------------------------------
initialization:
  # Initial flow field type. Valid: "parabolic", "uniform", "vortices",
  # "interpolate". ("random" and "laminar" are NOT implemented.)
  type: "vortices"

  # Parameters for vortex initialization
  perturbation_intensity: 0.08  # Amplitude of velocity perturbations
  n_vortices: 4                # Number of counter-rotating vortex pairs
  seed: 20260803               # Reproducible perturbations; omit for unseeded

  # RESTART FROM CHECKPOINT (uncomment to enable).
  # This previously pointed at results_big_550_stats/fields.npz, which does not
  # exist -- the only file in that folder is a 17x18x18 debug stub -- so the
  # config could not run as shipped.
  # field_file: "results_big_550_stats/fields.npz"
  # reset_time: false           # false: continue from saved time/step

  # NOTE: If field_file is in the output folder, it will be preserved during folder cleaning
  # NOTE: transition to turbulence from "vortices" takes O(100) time units and
  # can relaminarize. Seeding from an existing turbulent field via
  # type: "interpolate" is far more reliable -- see examples/re180_open/.

# ------------------------------------------------------------------------------
# POISSON SOLVER
# ------------------------------------------------------------------------------
solver:
  type: "fft"  # Poisson solver type. Options: "fft" (fast, recommended), "direct" (slow, for testing)

# ------------------------------------------------------------------------------
# TIME INTEGRATION
# ------------------------------------------------------------------------------
time:
  dt: 0.002               # Initial timestep (will adapt if dt_update_interval > 0)
  n_steps: 2000000000        # Maximum number of timesteps
  t_max: 300.0            # Maximum physical time (simulation stops at min(n_steps, t_max/dt))

  # Adaptive timestep control
  CFL_target: 0.28        # Target CFL number for adaptive timestep
  dt_update_interval: 10  # Update dt every N steps (0 = disable adaptive timestepping)
  dt_max: 0.011           # Maximum allowed timestep
  dt_min: 0.0003           # Minimum allowed timestep

  # Time integration scheme
  scheme: "IMEX"  # Options: "IMEX" (implicit wall-normal diffusion, recommended)
                  #          "FE"   (Forward Euler, testing/small cases only)
                  # There is no standalone "AB2" scheme: AB2 is the explicit
                  # predictor inside IMEX. "RK3" raises NotImplementedError.

# ------------------------------------------------------------------------------
# COMPUTE DEVICE
# ------------------------------------------------------------------------------
compute:
  device: "auto"  # Options: "cuda" (GPU), "cpu", "auto" (uses GPU if available)

# ------------------------------------------------------------------------------
# OUTPUT CONTROL
# ------------------------------------------------------------------------------
output:
  results_folder: results_big_550_stats  # Output directory (created if doesn't exist)
  n_out: 200                   # Print diagnostics every n_out steps
  n_save: 4000                 # Save flow fields every n_save steps

  # Saved files:
  #   - fields_init.npz: Initial flow field
  #   - fields.npz: Latest checkpoint (updated every n_save steps)
  #   - fields_final.npz: Final flow field
  #   - timeseries.npz: Time history of bulk velocity, u_tau, forcing

# ------------------------------------------------------------------------------
# TURBULENCE STATISTICS
# ------------------------------------------------------------------------------
statistics:
  # NOTE: statistics are enabled by n_stats > 0. There is no 'enabled' key --
  # the one that used to sit here was silently ignored by the code.

  # Collection parameters
  n_stats: 250     # Collect statistics every n_stats steps
  t_stats: 101.0    # Start collecting statistics after this physical time

  # Output files
  output_file: "turbulence_stats.npz"        # Final averaged statistics (saved at end)
  state_file: "turbulence_stats_state.npz"   # Checkpoint file (auto-saved with fields)

  # Spectral parameters
  z_plus_target: 15.0  # Wall distance in wall units (z⁺) for 2D premultiplied spectra

  # RESTART STATISTICS FROM CHECKPOINT (uncomment to enable; must exist)
  # restart_state_file: "results_big_550_stats/turbulence_stats_state.npz"

  # Statistics computed:
  #   - Mean profile U(z); dU/dz and omega_y are derived in plot_statistics
  #   - Reynolds stresses: u'u'(z), v'v'(z), w'w'(z), u'w'(z)
  #   - 2D premultiplied spectra at z⁺ = z_plus_target: kx*ky*E(kx,ky) for uu, vv, ww, uw

  # NOTE: Statistics are accumulated as running sums. The state_file contains:
  #   - All running sums (not yet divided by n_samples)
  #   - n_samples: number of snapshots accumulated
  # This allows restarting statistics collection after preemption without losing progress!
